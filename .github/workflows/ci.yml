name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exercises:
    name: Exercises (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - 00-rust-fundamentals
          - 01-solana-foundations
          - 02-anchor-deep-dive
          - 03-solana-security-deep-dive
          - 04-advanced-security-and-exploits
    defaults:
      run:
        working-directory: exercises/${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: exercises/${{ matrix.workspace }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (reference crates)
        run: cargo clippy -p solutions -p capstone-solution --all-targets -- -D warnings
      - name: Test reference solutions (unit, property, adversarial, integration)
        run: cargo test -p solutions
      - name: Starter compiles (tests are expected to fail until solved)
        run: cargo test -p starter --no-run
      - name: Capstone (solution green, honest tests green, every exploit test fails on the vulnerable crate)
        working-directory: .
        run: bash exercises/scripts/check_capstone.sh exercises/${{ matrix.workspace }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Dependency advisories (cargo audit)
        run: cargo audit

  generated:
    name: Starters and vulnerable capstones in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python3 exercises/scripts/sync_generated.py --check

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,403,429,503,999
            --timeout 30
            --exclude 'blog\.solend\.fi'
            --exclude 'medium\.com'
            --exclude-path exercises
            './**/*.md'
          fail: true
